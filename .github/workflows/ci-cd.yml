name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Checagem de tipos
        run: bun run typecheck

      - name: Testes com cobertura
        run: bun run test:coverage

      - name: Resumo da cobertura no pipeline
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const linha = (n, m) => `| ${n} | ${m.pct}% | ${m.covered}/${m.total} |`;
              console.log(["## Cobertura de testes", "| Métrica | % | Cobertos |", "|---|---|---|",
                linha("Linhas", t.lines), linha("Comandos", t.statements),
                linha("Funções", t.functions), linha("Ramos", t.branches)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-de-cobertura
          path: coverage/
          retention-days: 30

  build:
    name: build
    needs: testes
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Conferir segredos configurados
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL ausente"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Secret NEXT_PUBLIC_SUPABASE_ANON_KEY ausente"; exit 1; }

      - name: Build estático (Next.js export)
        run: bun run build

      - name: Empacotar site para o GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v5
